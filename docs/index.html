<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>api.getaced.io - API Documentation</title>
    <style>
        body { margin: 0; padding: 0; }
        #opencollection-container { width: 100vw; height: 100vh; }
    </style>
    <link rel="stylesheet" href="https://cdn.opencollection.com/docs.css">
    <script src="https://cdn.opencollection.com/docs.js"></script>
</head>
<body>
    <div id="opencollection-container"></div>
    <script>
        const collectionData = "opencollection: 1.0.0\ninfo:\n  name: api.getaced.io\nconfig:\n  proxy:\n    inherit: true\n    config:\n      protocol: http\n      hostname: ''\n      port: ''\n      auth:\n        username: ''\n        password: ''\n      bypassProxy: ''\nitems:\n  - info:\n      name: Public\n      type: folder\n      seq: 1\n    request:\n      auth: inherit\n    items:\n      - info:\n          name: Health Check\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{base_url}}/health'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Returns server status and uptime.\n\n          Response:\n          {\n            \"status\": \"ok\",\n            \"uptime\": \"3d 14h 22m\"\n          }\n      - info:\n          name: Google Sign In (open in browser)\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: '{{base_url}}/auth/google'\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Redirects to Google consent screen. After login redirects to:\n          {FRONTEND_URL}/auth/callback?token=<jwt>\n\n          Open in browser. Copy token from URL, set as jwt_token variable.\n  - info:\n      name: Payment (Step 1 after Sign In)\n      type: folder\n      seq: 2\n    request:\n      auth: inherit\n    docs:\n      content: 'Payment is required BEFORE onboarding. Creem handles the 1-week free trial \u2014 user enters payment info but is not charged for 7 days.'\n      type: text/markdown\n    items:\n      - info:\n          name: Checkout (Monthly)\n          type: http\n          seq: 1\n        http:\n          method: POST\n          url: '{{base_url}}/checkout'\n          headers:\n            - name: Content-Type\n              value: application/json\n          body:\n            type: json\n            data: |-\n              {\n                \"product_id\": \"{{monthly_product_id}}\",\n                \"success_url\": \"https://getaced.io/dashboard?payment=success\"\n              }\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Creates Creem checkout for monthly plan. Creem handles 1-week free trial.\n\n          Response: {\"checkout_url\": \"https://checkout.creem.io/...\"}\n\n          Redirect user to checkout_url. After payment, Creem webhook updates subscription_status.\n      - info:\n          name: Checkout (Yearly)\n          type: http\n          seq: 2\n        http:\n          method: POST\n          url: '{{base_url}}/checkout'\n          headers:\n            - name: Content-Type\n              value: application/json\n          body:\n            type: json\n            data: |-\n              {\n                \"product_id\": \"{{yearly_product_id}}\",\n                \"success_url\": \"https://getaced.io/dashboard?payment=success\"\n              }\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Creates Creem checkout for yearly plan.\n\n          Response: {\"checkout_url\": \"https://checkout.creem.io/...\"}\n  - info:\n      name: Onboarding (Step 2 \u2014 requires payment/trial)\n      type: folder\n      seq: 3\n    request:\n      auth: inherit\n    docs:\n      content: 'All onboarding endpoints require active subscription or trial (402 if not). Steps: 1. Link Drive \u2192 2. Chrome Setup \u2192 3. Complete'\n      type: text/markdown\n    items:\n      - info:\n          name: 1. Get Drive Auth URL\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{base_url}}/auth/google/drive'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Returns Google Drive OAuth URL. User must be on step OnboardingStepDrive.\n\n          Requires active subscription or trial (402 if not).\n\n          Response: {\"url\": \"https://accounts.google.com/...\"}\n\n          Open URL in browser. After consent, redirects to {FRONTEND_URL}/onboarding?step=chrome\n\n          Prevents duplicate Drive accounts \u2014 if this Drive is already linked to another user, returns error.\n      - info:\n          name: 2. Create Chrome Setup Session\n          type: http\n          seq: 2\n        http:\n          method: POST\n          url: '{{base_url}}/onboarding/chrome'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Creates Chrome container with VNC. User must be on step OnboardingStepChrome.\n\n          Requires active subscription or trial (402 if not).\n\n          Response: {\"session_url\": \"https://api.getaced.io/v1/s/abc123\"}\n\n          Open session_url in browser/iframe. 5 min window. User signs into Google in Chrome.\n\n          If container already exists (retry), it deletes the old one and creates fresh.\n      - info:\n          name: 3. Complete Onboarding\n          type: http\n          seq: 3\n        http:\n          method: POST\n          url: '{{base_url}}/onboarding/complete'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Marks onboarding done. Call after Chrome setup.\n\n          Requires active subscription or trial (402 if not).\n\n          Response: {\"onboarding_step\": \"complete\"}\n  - info:\n      name: User\n      type: folder\n      seq: 4\n    request:\n      auth: inherit\n    items:\n      - info:\n          name: Get Me\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{base_url}}/me'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Full user profile.\n\n          Response:\n          {\n            \"id\": 1,\n            \"email\": \"student@gmail.com\",\n            \"name\": \"John Doe\",\n            \"avatar_url\": \"https://lh3.googleusercontent.com/...\",\n            \"onboarding_step\": \"complete\" | \"OnboardingStepDrive\" | \"OnboardingStepChrome\",\n            \"subscription_status\": \"trialing\" | \"active\" | \"canceled\" | \"past_due\" | \"expired\" | \"\",\n            \"subscription_id\": \"sub_xxx\",\n            \"has_drive_connected\": true,\n            \"watch_folder_id\": \"1aBcDeFg...\",\n            \"bookmark_folder_name\": \"school work\",\n            \"usage_count\": 5,\n            \"usage_limit\": 30,\n            \"is_trialing\": false,\n            \"is_subscription_active\": true,\n            \"is_active\": true\n          }\n\n          Use onboarding_step to route user to correct page.\n          Use is_active to gate features.\n\n          Full flow check:\n          1. If subscription_status is empty \u2192 show checkout\n          2. If onboarding_step is OnboardingStepDrive \u2192 show Drive linking\n          3. If onboarding_step is OnboardingStepChrome \u2192 show Chrome setup\n          4. If onboarding_step is complete \u2192 show dashboard\n      - info:\n          name: Delete Account\n          type: http\n          seq: 2\n        http:\n          method: DELETE\n          url: '{{base_url}}/account'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Permanently deletes user, their Chrome container, Drive watch, and all processed files.\n\n          Response: {\"message\": \"account deleted\"}\n  - info:\n      name: Settings (requires payment/trial)\n      type: folder\n      seq: 5\n    request:\n      auth: inherit\n    docs:\n      content: All require active subscription or trial (402 if not).\n      type: text/markdown\n    items:\n      - info:\n          name: Get Settings\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{base_url}}/settings'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Response:\n          {\n            \"watch_folder_id\": \"1aBcDeFg...\",\n            \"bookmark_folder_name\": \"school work\",\n            \"custom_prompt\": \"\",\n            \"has_drive_connected\": true\n          }\n      - info:\n          name: Set Watch Folder\n          type: http\n          seq: 2\n        http:\n          method: PUT\n          url: '{{base_url}}/settings/watch-folder'\n          headers:\n            - name: Content-Type\n              value: application/json\n          body:\n            type: json\n            data: |-\n              {\n                \"folder_id\": \"PASTE_DRIVE_FOLDER_ID_HERE\"\n              }\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Sets which Drive folder to monitor. Also registers Drive push notifications.\n\n          folder_id from: https://drive.google.com/drive/folders/<THIS_PART>\n\n          Validates folder exists.\n\n          Response: {\"watch_folder_id\": \"...\"}\n\n          400 if folder not found or Drive not connected.\n      - info:\n          name: Set Bookmark Folder\n          type: http\n          seq: 3\n        http:\n          method: PUT\n          url: '{{base_url}}/settings/bookmark-folder'\n          headers:\n            - name: Content-Type\n              value: application/json\n          body:\n            type: json\n            data: |-\n              {\n                \"folder_name\": \"school work\"\n              }\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Sets Chrome bookmark folder name where answers appear. Default: \"school work\".\n\n          Response: {\"bookmark_folder_name\": \"...\"}\n      - info:\n          name: Set Custom Prompt\n          type: http\n          seq: 4\n        http:\n          method: PUT\n          url: '{{base_url}}/settings/prompt'\n          headers:\n            - name: Content-Type\n              value: application/json\n          body:\n            type: json\n            data: |-\n              {\n                \"custom_prompt\": \"This is AP Chemistry, use proper notation\"\n              }\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Appended to AI system prompt. Send empty string to clear.\n\n          Response: {\"custom_prompt\": \"...\"}\n  - info:\n      name: Usage & Activity (requires payment/trial)\n      type: folder\n      seq: 6\n    request:\n      auth: inherit\n    docs:\n      content: Require active subscription or trial (402 if not).\n      type: text/markdown\n    items:\n      - info:\n          name: Get Usage\n          type: http\n          seq: 1\n        http:\n          method: GET\n          url: '{{base_url}}/usage'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Response:\n          {\n            \"usage_count\": 5,\n            \"usage_limit\": 30,\n            \"usage_reset_at\": \"2026-04-15T00:00:00Z\",\n            \"subscription_status\": \"active\",\n            \"is_trialing\": false,\n            \"is_subscription_active\": true,\n            \"is_active\": true\n          }\n      - info:\n          name: Get Activity\n          type: http\n          seq: 2\n        http:\n          method: GET\n          url: '{{base_url}}/activity'\n          auth: inherit\n        settings:\n          encodeUrl: true\n          timeout: 0\n          followRedirects: true\n          maxRedirects: 5\n        docs: |-\n          Last 20 processed files with answers.\n\n          Response:\n          {\n            \"activity\": [\n              {\n                \"file_name\": \"Screenshot.png\",\n                \"answer_count\": 5,\n                \"answers\": [{\"number\": 1, \"answer\": \"A\"}, ...],\n                \"processed_at\": \"2026-03-15T22:49:20Z\"\n              }\n            ]\n          }\nrequest:\n  auth:\n    type: bearer\n    token: '{{jwt_token}}'\n  variables:\n    - name: base_url\n      value: https://api.getaced.io/v1\n    - name: jwt_token\n      value: ''\n    - name: monthly_product_id\n      value: ''\n    - name: yearly_product_id\n      value: ''\ndocs:\n  content: |-\n    Base URL: https://api.getaced.io/v1\n\n    All protected routes need: Authorization: Bearer <token>\n\n    Flow: Sign in \u2192 Checkout (starts trial) \u2192 Link Drive \u2192 Chrome Setup \u2192 Complete Onboarding \u2192 Set Watch Folder \u2192 Drop files\n\n    Trials handled by Creem. 30 uses/month. Supported files: PNG, HTML.\n  type: text/markdown\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .git\n    exportedAt: '2026-03-16T22:30:00.000Z'\n    exportedUsing: Bruno/3.1.4\n";
        new window.OpenCollection({
            target: document.getElementById('opencollection-container'),
            opencollection: collectionData,
            theme: 'light'
        });
    </script>
</body>
</html>
