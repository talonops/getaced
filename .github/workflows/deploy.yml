name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: 107.148.158.163
          username: talon
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/talon/getaced
            git pull origin main
            CGO_ENABLED=1 go build -o getaced ./src/...
            sudo systemctl restart getaced
